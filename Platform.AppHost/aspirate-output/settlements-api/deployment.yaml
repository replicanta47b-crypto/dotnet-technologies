---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlements-api
  labels:
    app: settlements-api
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: settlements-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: settlements-api
    spec:
      containers:
      - name: settlements-api
        image: docker.io/platform/settlements-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        envFrom:
        - configMapRef:
            name: settlements-api-env
      terminationGracePeriodSeconds: 180