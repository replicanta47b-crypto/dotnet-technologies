---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: docker.io/platform/gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: public
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: gateway-env
      terminationGracePeriodSeconds: 180