syntax = "proto3";

// Контракт gRPC-сервісу Payments (Лаб. 06). Спільний для сервера (Payments.Api) і клієнта (Aggregator).
option csharp_namespace = "Platform.Contracts.Payments";

package payments.v1;

service PaymentsService {
  // Платіж з розподілом на рахунки. Немає такого → StatusCode.NotFound.
  rpc GetPayment (GetPaymentRequest) returns (PaymentReply);
}

message GetPaymentRequest {
  int64 id = 1;
}

message AllocationReply {
  int64 invoice_id = 1;
  string invoice_number = 2;
  string invoice_amount = 3;      // decimal як рядок (InvariantCulture)
  string allocated_amount = 4;
}

message PaymentReply {
  int64 id = 1;
  int64 customer_id = 2;
  string currency = 3;
  string status = 4;
  string initiated_at = 5;        // ISO 8601
  string total_amount = 6;
  repeated AllocationReply allocations = 7;
}
