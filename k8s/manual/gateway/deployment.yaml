apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: gateway:v1
          imagePullPolicy: IfNotPresent      # образ зібрано локально (docker build) — у реєстр не публікується
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secrets
          startupProbe:                       # дає застосунку час на старт (міграції EF) до liveness
            httpGet: { path: /health/startup, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:                      # збій -> kubelet ПЕРЕЗАПУСКАЄ контейнер (процес завис)
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:                     # збій -> под ВИКЛЮЧАЄТЬСЯ з Service (без перезапуску)
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
