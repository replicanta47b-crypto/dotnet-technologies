# SQL Server для billing-api (BillingDb) і auth-api (IdentityDb); бази й міграції створюють самі сервіси.
# PersistentVolumeClaim: дані переживають перезапуск/зупинку пода (scale 0 → 1), тож бази BillingDb/IdentityDb не зникають
# і billing-api повертається в Ready без перезапуску. Docker Desktop має storage class за замовчуванням (hostpath).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sql-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql
  labels: { app: sql }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: sql }
  template:
    metadata:
      labels: { app: sql }
    spec:
      containers:
        - name: sql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "1536"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: sql-secrets, key: SA_PASSWORD }
          readinessProbe:
            tcpSocket: { port: 1433 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { memory: 1536Mi }
            limits: { memory: 2560Mi }
          volumeMounts:
            - { name: data, mountPath: /var/opt/mssql }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sql-data
---
apiVersion: v1
kind: Service
metadata:
  name: sql
spec:
  selector: { app: sql }
  ports:
    - { port: 1433, targetPort: 1433 }
