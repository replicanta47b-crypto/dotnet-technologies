# SQL Server для billing-api (BillingDb) і auth-api (IdentityDb); бази й міграції створюють самі сервіси.
# emptyDir: дані зникають із подом — достатньо для лабораторної (для production — PersistentVolumeClaim).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql
  labels: { app: sql }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: sql }
  template:
    metadata:
      labels: { app: sql }
    spec:
      containers:
        - name: sql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "1536"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: sql-secrets, key: SA_PASSWORD }
          readinessProbe:
            tcpSocket: { port: 1433 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { memory: 1536Mi }
            limits: { memory: 2560Mi }
          volumeMounts:
            - { name: data, mountPath: /var/opt/mssql }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sql
spec:
  selector: { app: sql }
  ports:
    - { port: 1433, targetPort: 1433 }
